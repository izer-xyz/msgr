"$schema" = "node_modules/wrangler/config-schema.json"
name = "trmnl-api"
main = "worker.js"
compatibility_date = "2026-08-20"
upload_source_maps = true
send_metrics = false

[observability]
enabled = true

[[durable_objects.bindings]]
name = "DEVICES"
class_name = "Devices"

[exports.Devices]
type = "durable-object"
storage = "sqlite"

[[analytics_engine_datasets]]
binding = "TRMNL_ANALYTICS"
dataset = "trmnl_analytics"

