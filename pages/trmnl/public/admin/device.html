<!doctype html>
<html lang="en" style="font-size:22px">
	<head>
		<meta charset="utf8" />
		<title>Aperçu</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<style type="text/tailwindcss">
			@theme {
			  --font-noto: "Noto Sans", sans-serif; 
			}
		</style>
	</head>
	<body class="">
		<header x-data class="w-96 m-auto my-4 flex text-center bg-gray-200 border-4 border-b-0 border-gray-200">
			<a href="/admin/messages" class="flex-1" :class="{ 'bg-white': location.href === $el.href }">Messagerie</a> 
			<a href="/admin/calendar" class="flex-1" :class="{ 'bg-white': location.href === $el.href }">Calandrier</a> 
			<a href="/admin/device"   class="flex-1" :class="{ 'bg-white': location.href === $el.href }">Aperçu</a> 
			<a href="/admin/profile"  class="flex-1" :class="{ 'bg-white': location.href === $el.href }">Profil</a>
		</header>
		<main class="w-96 m-auto text-xs border-4 border-white">
			<div x-data="context" x-init="list" class="flex flex-col gap-4">
				<div class="border-2 border-gray-200 p-2 pb-6">
					<div class="bg-black">
						<img x-init="$watch('selected', v => preview($el, v))" class="w-full h-auto opacity-85" />
					</div>
				</div>
				<form @submit.prevent="save(selected, $el)" class="flex flex-col gap-2">
					<div class="flex flex-col">
						<label for="battery-voltage">Batterie (V)</label>
						<input id="battery-voltage" type="text" readonly x-model="selected['battery-voltage']" class="rounded-md p-1 ml-2 text-right"/>
					</div>

					<div class="flex flex-col">
						<label for="sleep_from">En Veille <span x-text="selected.sleep ? '(actif)' : ''"></span></label> 
						<div class="flex justify-end">
							<select id="sleep_from" x-model="selected.sleep_from" @change="selected.sleep_to = $el.value === '' ? $el.value : selected.sleep_to">
								<option value="">--:--</option>
								<template x-for="h in 23">
									<template x-for="m in ['00', '30']">
										<option x-text="`${h<10?'0':''}${h}:${m}`"></option>
									</template>
								</template>
								</select> - 
							<select id="sleep_to" x-model="selected.sleep_to" @change="selected.sleep_from = $el.value === '' ? $el.value : selected.sleep_from">
								<option value="">--:--</option>
								<template x-for="h in 23">
									<template x-for="m in ['00', '30']">
										<option x-text="`${h<10?'0':''}${h}:${m}`"></option>
									</template>
								</template>
								</select>
						</div>
					</div>
				  <div class="flex items-center justify-end gap-x-2 mt-4">
						<button type="submit" class="self-end text-white bg-black font-semibold rounded-lg px-2 py-1">
							Enregsitrer
						</button>
				  </div>
					<div class="mt-8"><select @change="selected = devices[$el.value]">
						<template x-for="(item, index) in devices">
							<option x-text="item.id" :value="index"></option>
						</template>
					</select></div>
				</div>
				</form>
			</div>
		</main>
		<script>
			const DEFAULT = {
				id: "",
				height: "",
				width: "",
				screen: "",
				refresh_rate: "",
				friendly_id: "",
				depth: "",
				sleep_from: "",
				sleep_to: "",
				time_zone: "",
				rssi: "",
				updated: "",
				"battery-voltage": "",
				"x-real-ip": "",
				"fw-version":"", 
				model:"",
				
				};

			function context() {
				return {
					DEFAULT,
					devices: [],
					selected: {
						...DEFAULT,
					},

					async list() {
						await this.fetch("GET");
					},

					async save(device) {
						let response = await this.fetch("POST", device);
						// todo check for errors.
					},

					async fetch(method, device) {
						let response = await (
							await fetch("/api/admin/device", {
								method: method,
								body: device ? JSON.stringify(device) : null,
							})
						).json();
						this.devices = response.devices;
						if (this.selected.id === "" && this.devices.length > 0) {
							this.selected = this.devices[0]; 
						}
						return response;
					},
					async preview(el, device) {
						if (!device.id) return; 
						let url = `/api/screen/${getFilename(device)}`; 
						let options = {
							headers: {
								"ID": device.id,
							}
						}
						el.src = URL.createObjectURL(await (await fetch(url, options)).blob()); 
					},
				};
			}

			function getFilename(device) {
				const M = 60 * 1000,
					H = 60 * M,
					D = 24 * H,
					W = 7 * D;
				let coef =
					[
						M,
						2 * M,
						5 * M,
						10 * M,
						15 * M,
						30 * M,
						H,
						2 * H,
						3 * H,
						6 * H,
						12 * H,
						D,
						2 * D,
						W,
					].find((c) => c >= Number(device.refresh_rate) * 1000) || W;

				let dateTime = luxon.DateTime.fromMillis(
					Math.ceil(
						luxon.DateTime.now()
							.setZone(device.time_zone)
							.setZone("utc", { keepLocalTime: true })
							.toMillis() / coef,
					) * coef,
					{zone: "utc"}
				);

				return `${device.screen}/${dateTime.toFormat("yyyy-MM-dd/HH:mm")}/0.png`;
			}

		</script>
	</body>
</html>
