<!doctype html>
<html lang="en" style="font-size: 22px">
	<head>
		<meta charset="utf8" />
		<title>Messagerie</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>
		<script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<style type="text/tailwindcss">
			@theme {
				--font-noto: "Noto Sans", sans-serif;
			}
		</style>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=chat,calendar_clock,aod_tablet,settings,close,instant_mix,delete"
			rel="stylesheet"
		/>
	</head>
	<body class="">
		<header
			x-data
			class="max-w-96 m-auto my-4 font-bold text-sm flex justify-evenly text-center bg-gray-200 border-4 border-b-0 border-gray-200"
		>
			<a
				href="/admin/messages"
				class="px-1"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				<span class="align-middle material-symbols-outlined">chat</span>
				Message
			</a>
			<a
				href="/admin/calendar"
				class="px-1"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				<span class="align-middle material-symbols-outlined"
					>calendar_clock</span
				>
				Programme
			</a>
			<a
				href="/admin/device"
				class="px-1"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				<span class="align-middle material-symbols-outlined">aod_tablet</span>
				Tablette
			</a>
			<a
				href="/admin/profile"
				class="px-1"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				<span class="align-middle material-symbols-outlined">settings</span>
				Profil
			</a>
		</header>
		<main class="max-w-96 m-auto text-xs border-4 border-white">
			<p class="mx-4 mb-4 p-2 text-white bg-green-800 rounded-lg">
				? Send a message to the board (type and send), setup a daily message (by
				select the day of the week), or delete a message from the list at the
				bottom.
			</p>
			<div x-data="context" x-init="list">
				<form @submit.prevent="save(msg)" class="flex flex-col gap-4">
					<div class="flex flex-col">
						<div class="flex justify-end">
							<a
								xclass="text-center px-1 border-2 border-gray-200 bg-gray-200"
								href=""
								xxclass="{
										'bg-white': selected_date !== ''
						      }"
								@click.prevent="select('')"
							>
							</a>
							<a href="" class="flex-auto font-bold" x-show="!selected_date">
								Message du Jour
								<span class="align-middle material-symbols-outlined"
									>close</span
								>
							</a>
							<div class="flex gap-x-1 bg-gray-200">
								<template x-for="(d,i) in ['Lu','Ma','Me','Je','Ve','Sa','Di']">
									<a
										href=""
										class="px-1 border-2 border-gray-200"
										:class="{
												'bg-white': selected_day === i + 1 && selected_date === '', 
												'font-bold': selected_day === i + 1,
											  'underline': week[i+1],
												'text-red-800': i > 4
											}"
										@click.prevent="select(i+1)"
										x-text="d"
									></a>
								</template>
								<a
									href=""
									class="align-middle material-symbols-outlined bg-white"
									@click.prevent="select(1)"
									>instant_mix</a
								>
							</div>
						</div>
					</div>
					<div class="flex flex-col ml-2">
						<textarea
							id="content"
							name="content"
							autofocus
							x-model="msg.content"
							class="font-bold rounded-md border-1 p-1"
							rows="2"
							placeholder="Tapez votre message ici et appuyez sur Entrée pour envoyer."
							x-init="$watch('msg.content', () => $el.focus())"
							@keydown.enter.prevent="$el.form.requestSubmit()"
						></textarea>
					</div>
					<div
						class="flex items-center justify-end gap-x-2 font-semibold text-red-800"
					>
						<button
							type="submit"
							class="self-end text-white bg-black font-semibold rounded-lg px-2 py-1"
						>
							Envoyer
						</button>
					</div>
				</form>

				<div class="my-4 text-base font-bold">Liste des Message</div>
				<div id="preview" class="flex-1 flex flex-col p-2 bg-gray-200 h-[10em]">
					<template x-if="week[selected_day]">
						<div
							class="flex flex-col w-[20em] self-end"
							@click.prevent="(msg.id === week[selected_day].id ? msg = { ...DEFAULT } : msg = { ...week[selected_day], from: profile.name })"
						>
							<span
								class="border-1 px-2 py-1 rounded-lg"
								:class="{'border-white': !week[selected_day].day, 'border-black': week[selected_day].day, 'bg-white': week[selected_day].id == msg.id}"
								x-text="week[selected_day].content"
							>
							</span>
							<span class="self-end" x-text="week[selected_day].from"></span>
						</div>
					</template>
					<template x-for="item in msgs">
						<div
							class="flex self-end"
							x-show="item.day === selected_day.toString() || item.date && selected_date"
						>
							<div class="flex flex-col w-[20em]">
								<span
									class="border-1 px-2 py-1 rounded-lg"
									:class="{'border-white': !item.day, 'border-black': item.day, 'bg-white': item.id == msg.id}"
									x-text="item.content"
								>
								</span>
								<span class="self-end" x-text="item.from"></span>
							</div>
							<a
								href=""
								class="p-1 material-symbols-outlined"
								@click.prevent="remove(item)"
								>delete</a
							>
						</div>
					</template>
				</div>
			</div>
		</main>
		<script>
			const DEFAULT = {
				date: "",
				content: "",
				time: "",
				from: "",
				id: "",
				reference: "",
				day: "",
			};

			function context() {
				let now = () =>
					luxon.DateTime.now()
						.setZone("Indian/Reunion")
						.toFormat("yyyy-LL-dd TT c")
						.split(" ");
				return {
					DEFAULT,
					week: [],
					msgs: [],
					msg: {
						...DEFAULT,
					},

					profile: {},
					last_date: [now()[0], Number(now()[2])],
					selected_date: now()[0],
					selected_day: Number(now()[2]),

					select(day) {
						if (day === "") {
							this.selected_date = this.last_date[0];
							this.selected_day = this.last_date[1];
						} else {
							this.selected_date = "";
							this.selected_day = day;
						}
						this.msg = this.week[day] || { ...DEFAULT, day: day };
					},

					async list() {
						await this.fetch("GET");
					},

					async save(msg) {
						msg.from = this.profile.name;
						if (msg.day === "") {
							msg.date = this.last_date[0];
							msg.time = now()[1];
						} else {
							msg.date = "";
							msg.time = "";
						}
						let response = await this.fetch("POST", msg);
						// todo check for errors.
						this.msg = { ...DEFAULT };
					},

					async remove(msg) {
						// this.msg = { ...msg, id: "", reference: "" };
						if (confirm("Supprimer le message?")) {
							await this.fetch("DELETE", msg);
						}
					},

					async fetch(method, msg) {
						let response = await (
							await fetch(`/api/admin/messages?${this.last_date[0]}`, {
								method: method,
								body: msg ? JSON.stringify(msg) : null,
							})
						).json();
						this.week = response.week;
						this.msgs = response.msgs;
						this.profile = response.profile;
						DEFAULT.from = this.msg.from = this.profile.name;
						return response;
					},
				};
			}
		</script>
	</body>
</html>
