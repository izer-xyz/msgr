<!doctype html>
<html lang="en" style="font-size: 22px">
	<head>
		<meta charset="utf8" />
		<title>Messagerie</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>
		<script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<style type="text/tailwindcss">
			@theme {
				--font-noto: "Noto Sans", sans-serif;
			}
		</style>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=aod_tablet,calendar_clock,chat,close,delete,edit,instant_mix,settings&display=block"
			rel="stylesheet"
		/>
	</head>
	<body class="">
		<header
			x-data
			class="max-w-96 m-auto text-2xl text-center font-[Material_Symbols_Outlined] my-2 flex bg-gray-200 border-4 border-b-0 border-gray-200"
		>
			<a
				href="/admin/messages"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
				>chat</a
			>
			<a
				href="/admin/calendar"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				calendar_clock
			</a>
			<a
				href="/admin/device"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				aod_tablet
			</a>
			<a
				href="/admin/profile"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				settings
			</a>
		</header>
		<main class="max-w-96 flex flex-col m-auto text-xs border-4 border-white">
			<span class="text-lg font-bold pb-2">Messages</span>
			<p class="mx-4 mb-4 p-2 text-white bg-green-800 rounded-lg">
				? Send a message to the board (type and send), setup a daily message (by
				select the day of the week), or delete a message from the list at the
				bottom.
			</p>
			<div x-data="context" x-init="list">
				<form
					@submit.prevent="msg.content && save(msg)"
					class="flex flex-col gap-4"
				>
					<div class="flex flex-col">
						<div class="flex gap-x-1 justify-between">
							<a
								href=""
								class="flex-auto font-bold"
								:class="{'text-white':selected_date}"
							>
								<span x-text="dateOrDay().split(' ')[0]"></span>
								<span class="align-middle material-symbols-outlined"
									>close</span
								>
							</a>
							<template x-for="(d,i) in ['Lu','Ma','Me','Je','Ve','Sa','Di']">
								<a
									href=""
									class="px-1 border-2 border-gray-200 bg-gray-200"
									:class="{
												'bg-white': selected_day === i + 1 && selected_date === '', 
												'font-bold': selected_day === i + 1,
											  'underline': week[i+1],
												'text-red-800': i > 4
											}"
									@click.prevent="select(i+1)"
									x-text="d"
								></a>
							</template>
							<a
								href=""
								class="align-middle material-symbols-outlined bg-white"
								@click.prevent="select(1)"
								>instant_mix</a
							>
						</div>
					</div>
					<div class="flex flex-col ml-2">
						<textarea
							id="content"
							name="content"
							autofocus
							x-model="msg.content"
							class="font-bold rounded-md border-1 p-1"
							rows="2"
							placeholder="Tapez votre message ici et appuyez sur Entrée pour envoyer."
							x-init="$watch('msg.content', () => $el.focus())"
							@keydown.enter.prevent="$el.form.requestSubmit()"
						></textarea>
					</div>
					<div
						class="flex items-center justify-end gap-x-2 font-semibold text-red-800"
					>
						<button
							type="submit"
							class="self-end text-white bg-black font-semibold rounded-lg px-2 py-1"
						>
							Envoyer
						</button>
					</div>
				</form>

				<div class="my-2 text-lg font-bold capitalize" x-text="dateOrDay"></div>
				<div id="preview" class="flex-1 flex flex-col p-2 h-[30em] bg-gray-200">
					<template x-for="item in [week[selected_day] || {}, ...msgs]">
						<div
							class="flex justify-between items-center mb-1 pl-2 leading-3 hover:bg-white"
							:class="{'bg-white': msg === item}"
							x-show="item.day === selected_day || item.date && selected_date"
						>
							<div class="w-[19em] flex flex-col font-semibold">
								<div class="mb-[12px] flex flex-col">
									<span
										class="border-b-[2px] border-black px-[16px] py-[8px]"
										x-text="item.content"
									>
									</span>
									<div class="flex justify-between text-[.8em]">
										<span
											class="text-gray-700"
											x-text="item.time?.slice(0,5)"
										></span>
										<span x-text="item.from"></span>
									</div>
								</div>
							</div>
							<a
								href=""
								class="px-1 material-symbols-outlined"
								x-show="!item.day"
								@click.prevent="remove(item)"
								>delete</a
							>
							<a
								href=""
								class="px-1 material-symbols-outlined"
								x-show="item.day"
								@click.prevent="select(item.day)"
								>edit</a
							>
						</div>
					</template>
				</div>
				<div
					id="error"
					class="flex p-1 text-center bg-red-800 text-white"
					x-show="msgs && ($el.style.height = ($el.previousElementSibling.scrollHeight - $el.previousElementSibling.clientHeight) + 'px')"
				>
					Limit d'ecran
				</div>
			</div>
		</main>
		<script>
			const DEFAULT = {
				date: "",
				content: "",
				time: "",
				from: "",
				id: "",
				reference: "",
				day: "",
			};

			function context() {
				let now = () =>
					luxon.DateTime.now()
						.setZone("Indian/Reunion")
						.toFormat("yyyy-LL-dd TT c")
						.split(" ");
				return {
					DEFAULT,
					week: [],
					msgs: [],
					msg: {
						...DEFAULT,
					},

					profile: {},
					last_date: [now()[0], Number(now()[2])],
					selected_date: now()[0],
					selected_day: Number(now()[2]),

					select(day) {
						if (day === "") {
							this.selected_date = this.last_date[0];
							this.selected_day = this.last_date[1];
						} else {
							this.selected_date = "";
							this.selected_day = day;
						}
						this.msg = this.week[day] || { ...DEFAULT, day: day };
					},

					async list() {
						await this.fetch("GET");
					},

					async save(msg) {
						msg.from = this.profile.name;
						if (msg.day === "") {
							msg.date = this.last_date[0];
							msg.time = now()[1];
						} else {
							msg.date = "";
							msg.time = "";
						}
						let response = await this.fetch("POST", msg);
						// todo check for errors.
						this.msg = { ...DEFAULT };
					},

					async remove(msg) {
						// this.msg = { ...msg, id: "", reference: "" };
						if (confirm("Supprimer le message?")) {
							await this.fetch("DELETE", msg);
						}
					},

					async fetch(method, msg) {
						let response = await (
							await fetch(`/api/admin/messages?${this.last_date[0]}`, {
								method: method,
								body: msg ? JSON.stringify(msg) : null,
							})
						).json();
						this.week = response.week;
						this.msgs = response.msgs;
						this.profile = response.profile;
						DEFAULT.from = this.msg.from = this.profile.name;
						return response;
					},

					dateOrDay() {
						return this.selected_date
							? luxon.DateTime.fromISO(this.selected_date)
									.setLocale("fr")
									.toLocaleString(luxon.DateTime.DATE_HUGE)
							: luxon.DateTime.fromObject({ weekday: this.selected_day })
									.setLocale("fr")
									.toFormat("cccc") + " (récurrents)";
					},
				};
			}
		</script>
	</body>
</html>
