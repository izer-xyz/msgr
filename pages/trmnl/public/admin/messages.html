<!doctype html>
<html lang="en" style="font-size: 22px">
	<head>
		<meta charset="utf8" />
		<title>Messagerie</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>
		<script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<style type="text/tailwindcss">
			@theme {
				--font-noto: "Noto Sans", sans-serif;
			}
		</style>
	</head>
	<body class="">
		<header
			x-data
			class="w-96 m-auto my-4 flex text-center font-bold bg-gray-200 border-4 border-b-0 border-gray-200"
		>
			<a
				href="/admin/messages"
				class="flex-1"
				:class="{ 'bg-white': location.href === $el.href }"
				>Messagerie</a
			>
			<a
				href="/admin/calendar"
				class="flex-1"
				:class="{ 'bg-white': location.href === $el.href }"
				>Calandrier</a
			>
			<a
				href="/admin/device"
				class="flex-1"
				:class="{ 'bg-white': location.href === $el.href }"
				>Aperçu</a
			>
			<a
				href="/admin/profile"
				class="flex-1"
				:class="{ 'bg-white': location.href === $el.href }"
				>Profil</a
			>
		</header>
		<main class="w-96 m-auto text-xs border-4 border-white">
			<div x-data="context" x-init="list">
				<form @submit.prevent="save(msg)" class="flex flex-col gap-4">
					<div class="w-full flex gap-x-4">
						<a
							class="flex-auto"
							href=""
							:class="{'font-bold': selected === ''}"
							@click.prevent="select('')"
							x-text="now()[0]"
						></a>
						<template x-for="(d,i) in ['Lu','Ma','Me','Je','Ve','Sa','Di']">
							<a
								href=""
								:class="{'font-bold': selected === (i + 1).toString() || selected === '' && now()[2] === (i + 1).toString()}"
								@click.prevent="select((i+1).toString())"
								x-text="d"
							></a>
						</template>
					</div>
					<div class="flex flex-col ml-2">
						<textarea
							id="content"
							name="content"
							autofocus
							x-model="msg.content"
							class="font-bold rounded-md border-1 p-1"
							rows="2"
							placeholder="Tapez votre message ici et appuyez sur Entrée pour envoyer."
							x-init="$watch('msg.content', () => $el.focus())"
							@keydown.enter.prevent="$el.form.requestSubmit()"
						></textarea>
						<div class="self-end p-1" x-text="msg.from"></div>
					</div>
					<div class="flex items-center justify-end gap-x-2">
						<a href="" x-show="msg.id" @click.prevent="remove(msg)" class="">
							Supprimer
						</a>
						<button
							type="submit"
							class="self-end text-white bg-black font-semibold rounded-lg px-2 py-1"
						>
							Envoyer
						</button>
					</div>
				</form>

				<div class="my-4 text-base font-bold">Aperçu</div>
				<div id="preview" class="flex-1 flex flex-col p-2 bg-gray-200 h-[10em]">
					<template x-for="item in msgs">
						<div
							class="flex flex-col w-[20em] self-end"
							x-show="item.day === selected || selected ==='' && item.day === now()[2]"
							@click.prevent="(msg.id === item.id ? msg = { ...DEFAULT } : msg = { ...item, from: profile.name })"
						>
							<span
								class="border-1 px-2 py-1 rounded-lg"
								:class="{'border-white': !item.day, 'border-black': item.day, 'bg-white': item.id == msg.id}"
								x-text="item.content"
							>
							</span>
							<span class="self-end" x-text="item.from"></span>
						</div>
					</template>
				</div>
			</div>
		</main>
		<script>
			const DEFAULT = {
				date: "",
				content: "",
				time: "",
				from: "",
				id: "",
				reference: "",
				day: "",
			};

			function context() {
				return {
					DEFAULT,
					msgs: [],
					msg: {
						...DEFAULT,
					},
					profile: {},
					selected: "",

					now() {
						return luxon.DateTime.now()
							.setZone("Indian/Reunion")
							.toFormat("yyyy-LL-dd TT c")
							.split(" ");
					},

					select(day) {
						this.selected = day;
						this.msg = { ...DEFAULT, day: day };
					},

					async list() {
						await this.fetch("GET");
					},

					async save(msg) {
						if (msg.day === "") {
							msg.date = this.now()[0];
							msg.time = this.now()[1];
						} else {
							msg.date = "";
							msg.time = "";
						}
						let response = await this.fetch("POST", msg);
						// todo check for errors.
						this.msg = { ...DEFAULT };
					},

					async remove(msg) {
						this.msg = { ...msg, id: "", reference: "" };
						await this.fetch("DELETE", msg);
					},

					async fetch(method, msg) {
						let response = await (
							await fetch(`/api/admin/messages?${this.now()[0]}`, {
								method: method,
								body: msg ? JSON.stringify(msg) : null,
							})
						).json();
						this.msgs = response.messages;
						this.profile = response.profile;
						DEFAULT.from = this.profile.name;
						return response;
					},
				};
			}
		</script>
	</body>
</html>
