<!doctype html>
<html lang="en" style="font-size: 22px">
	<head>
		<meta charset="utf8" />
		<title>Profil</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>
		<script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<style type="text/tailwindcss">
			@theme {
				--font-noto: "Noto Sans", sans-serif;
			}
		</style>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=aod_tablet,calendar_clock,chat,close,delete,edit,instant_mix,logout,settings&display=block"
			rel="stylesheet"
		/>
	</head>
	<body class="">
		<header
			x-data
			class="max-w-96 m-auto text-2xl text-center font-[Material_Symbols_Outlined] my-2 flex bg-gray-200 border-4 border-b-0 border-gray-200"
		>
			<a
				href="/admin/messages"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
				>chat</a
			>
			<a
				href="/admin/calendar"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				calendar_clock
			</a>
			<a
				href="/admin/device"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				aod_tablet
			</a>
			<a
				href="/admin/profile"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				settings
			</a>
		</header>
		<main class="max-w-96 flex flex-col m-auto text-xs border-4 border-white">
			<div class="flex justify-between text-lg pb-2">
				<span class="font-bold">Profil</span>
				<a
					href="http://w1n.cloudflareaccess.com/cdn-cgi/access/logout"
					class="font-[Material_Symbols_Outlined]"
				>
					logout
				</a>
			</div>
			<div x-data="context" x-init="get">
				<form @submit.prevent="save(profile)" class="flex flex-col gap-2">
					<div class="flex flex-col">
						<label for="email">E-mail</label>
						<input
							id="email"
							type="text"
							readonly
							x-model="profile.email"
							class="rounded-md p-1 ml-2 text-right"
						/>
					</div>
					<div class="flex flex-col">
						<label for="name">Nom</label>
						<input
							id="name"
							type="text"
							x-model="profile.name"
							class="rounded-md border-1 p-1 ml-2 text-right"
						/>
					</div>
					<div class="flex items-center justify-end gap-x-2 mt-4">
						<button
							type="submit"
							class="self-end text-white bg-black font-semibold rounded-lg px-2 py-1"
						>
							Enregsitrer
						</button>
					</div>
				</form>
			</div>
		</main>
		<script>
			const DEFAULT = {
				email: "",
				name: "",
			};

			function context() {
				return {
					DEFAULT,
					profile: {
						...DEFAULT,
					},

					async get() {
						await this.fetch("GET");
					},

					async save(profile) {
						let response = await this.fetch("POST", profile);
						// todo check for errors.
					},

					async fetch(method, profile) {
						let response = await (
							await fetch("/api/admin/profile", {
								method: method,
								body: profile ? JSON.stringify(profile) : null,
							})
						).json();
						this.profile = response.profile;
						return response;
					},
				};
			}
		</script>
	</body>
</html>
