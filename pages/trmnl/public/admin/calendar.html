<!doctype html>
<html lang="en" style="font-size: 22px">
	<head>
		<meta charset="utf8" />
		<title>Messagerie</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>
		<script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
		<style type="text/tailwindcss">
			@theme {
				--font-noto: "Noto Sans", sans-serif;
			}
		</style>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&icon_names=aod_tablet,calendar_clock,chat,close,delete,edit,instant_mix,settings,visibility,visibility_off&display=block"
			rel="stylesheet"
		/>
	</head>
	<body class="">
		<header
			x-data
			class="max-w-96 m-auto text-2xl text-center font-[Material_Symbols_Outlined] my-2 flex bg-gray-200 border-4 border-b-0 border-gray-200"
		>
			<a
				href="/admin/messages"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
				>chat</a
			>
			<a
				href="/admin/calendar"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				calendar_clock
			</a>
			<a
				href="/admin/device"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				aod_tablet
			</a>
			<a
				href="/admin/profile"
				class="px-1 grow"
				:class="{ 'bg-white': location.href === $el.href }"
			>
				settings
			</a>
		</header>
		<main class="max-w-96 flex flex-col m-auto text-xs border-4 border-white">
			<span class="text-lg font-bold pb-2">Programme</span>
			<div x-data="context" x-init="list">
				<form @submit.prevent="save(event)" class="flex flex-col gap-4">
					<div class="flex gap-x-1 justify-between">
						<input
							type="date"
							x-model="selected_date"
							x-show="selected_date"
							class="w-24 text-center px-1 border-2 border-gray-200"
							@change.prevent="select_date"
						/>
						<span></span>
						<div class="flex gap-x-1 justify-end">
							<template x-for="(d,i) in ['Lu','Ma','Me','Je','Ve','Sa','Di']">
								<a
									href=""
									class="px-1 border-2 border-gray-200 bg-gray-200"
									:class="{
										'bg-white': selected_day === i + 1 && selected_date === '', 
										'border-gray-800': selected_day === i + 1 && selected_date === '', 
										'font-bold': selected_day === i + 1,
										'underline': week[i+1],
										'text-red-800': i > 4
									}"
									@click.prevent="select((i+1).toString())"
									><span x-text="d"></span
									><span
										class="align-middle ml-1 material-symbols-outlined"
										x-show="selected_day === i + 1 && selected_date === ''"
										>close</span
									></a
								>
							</template>
						</div>
					</div>

					<div class="flex">
						<select
							name="time"
							:value="event.time"
							class=""
							@change.prevent="select_time($el.value)"
							autofocus
						>
							<option value="">--:--</option>
							<template x-for="h in 13">
								<template x-for="m in ['00', '30']">
									<option x-text="`${h+7<10?'0':''}${h+7}:${m}`"></option>
								</template>
							</template>
						</select>
						<input
							name="subject"
							type="text"
							x-model="event.subject"
							placeholder="Activite"
							class="flex-auto rounded-md border-1 p-1 ml-2 font-bold"
							x-init="$watch('event.subject', v => v && $el.focus())"
						/>
					</div>
					<textarea
						id="content"
						name="content"
						x-model="event.content"
						class="rounded-md border-1 p-1"
						rows="2"
						placeholder="Tapez la description d'activitee et appuyez sur Entrée pour valider."
						@keydown.enter.prevent="$el.form.requestSubmit()"
					></textarea>
					<div class="flex items-center justify-end gap-x-2">
						<a
							href=""
							x-show="event.id"
							@click.prevent="remove(event)"
							class=""
						>
							Supprimer
						</a>
						<button
							type="submit"
							class="self-end text-white bg-black font-semibold rounded-lg px-2 py-1"
						>
							Valider
						</button>
					</div>
				</form>

				<div
					class="my-2 text-lg font-bold capitalize flex items-center justify-between"
				>
					<span x-text="dateOrDay"></span>
					<a
						href=""
						class="mx-3 material-symbols-outlined"
						x-show="selected_date && !events[0]?.hide"
						@click.prevent="hide()"
						>visibility_off</a
					>
					<a
						href=""
						class="mx-3 material-symbols-outlined"
						x-show="events[0]?.hide"
						@click.prevent="remove(events[0])"
						>visibility</a
					>
				</div>
				<div id="preview" class="flex-1 flex flex-col p-2 bg-gray-200 h-[25em]">
					<template x-for="(item,index) in events">
						<div
							class="flex justify-between items-center hover:bg-white pl-2"
							:class="{'bg-white': event === item}"
							x-show="(item.day === selected_day.toString() && !events[0].hide) || item.date && selected_date && !item.hide"
						>
							<div class="mb-[8px] w-[19em] text-md font-bold">
								<span class="text-gray-700 text-lg" x-text="item.time"></span>
								<span class="text-lg" x-text="item.subject"></span>
								<div
									class="font-normal text-xs ml-[1px]"
									x-text="item.content"
								></div>
							</div>
							<a
								href=""
								class="px-1 material-symbols-outlined"
								x-show="item.date || !selected_date"
								@click.prevent="(event === item ? event = { ...DEFAULT } : event = item)"
								>edit</a
							>
							<a
								href=""
								class="px-1 material-symbols-outlined"
								x-show="!item.date && selected_date"
								@click.prevent="hide()"
								>visibility_off</a
							>
						</div>
					</template>
				</div>
				<div class="flex p-1 text-center bg-red-800 text-white">
					<span
						x-show="events && document.getElementById('preview').scrollHeight > document.getElementById('preview').clientHeight"
						>Limit d'ecran</span
					>
				</div>
			</div>
		</main>
		<script>
			const DEFAULT = {
				date: "",
				subject: "",
				content: "",
				time: "",
				from: "",
				id: "",
				reference: "",
				day: "",
				flag: "",
			};

			function context() {
				let now = () =>
					luxon.DateTime.now()
						.setZone("Indian/Reunion")
						.toFormat("yyyy-LL-dd TT c")
						.split(" ");

				return {
					DEFAULT,
					month: [],
					week: [],
					events: [],
					event: {
						...DEFAULT,
					},
					last_date: [now()[0], Number(now()[2])],
					selected_date: now()[0],
					selected_day: Number(now()[2]),

					//now,

					select(day) {
						if (day === this.selected_day.toString() && !this.selected_date) {
							this.selected_date = this.last_date[0];
							this.selected_day = this.last_date[1];
							this.event = { ...DEFAULT, day: day };
						} else {
							this.event = this.week[day] || { ...DEFAULT, day: day };
							this.selected_date = "";
							this.selected_day = Number(day);
						}
					},

					select_time(time) {
						this.event =
							this.events.find(
								(item) =>
									item.time === time &&
									((!this.selected_date &&
										item.day === this.selected_day.toString()) ||
										(this.selected_date && item.date === this.selected_date)),
							) || this.event;
					},

					select_date() {
						let dateTime = luxon.DateTime.fromISO(this.selected_date);
						this.selected_day = dateTime.toFormat("c");
						this.last_date = [this.selected_date, this.selected_day];
						this.list();
					},
					select_month(month) {
						let dateTime = luxon.DateTime.fromISO(this.selected_date)
							.set({
								day: 1,
							})
							.plus({ month: month });
						this.selected_date = dateTime.toFormat("yyyy-LL-dd");
						this.selected_day = dateTime.toFormat("c");
						this.last_date = [this.selected_date, this.selected_day];
						this.list();
					},

					async list() {
						await this.fetch("GET");
					},

					async save(event) {
						if (event.day === "" && event.date === "") {
							if (this.selected_date === "") {
								event.day = this.selected_day.toString();
							} else {
								event.date = this.selected_date;
							}
						}
						let response = await this.fetch("POST", event);
						// todo check for errors.
						this.event = { ...DEFAULT };
						//this.selected = "";
					},

					async hide() {
						this.save({
							...DEFAULT,
							date: this.selected_date,
							reference: "-",
							hide: this.selected_day.toString(),
						});
					},

					async remove(event) {
						this.event = { ...event, id: "", reference: "" };
						await this.fetch("DELETE", event);
					},

					async fetch(method, event) {
						let response = await (
							await fetch(
								`/api/admin/calendar?${this.selected_date || this.last_date[0]}`,
								{
									method: method,
									body: event ? JSON.stringify(event) : null,
								},
							)
						).json();
						this.events = response.day;
						this.month = response.month;
						this.week = response.week;
						return response;
					},
					dateOrDay() {
						return this.selected_date
							? luxon.DateTime.fromISO(this.selected_date)
									.setLocale("fr")
									.toLocaleString(luxon.DateTime.DATE_HUGE)
							: luxon.DateTime.fromObject({ weekday: this.selected_day })
									.setLocale("fr")
									.toFormat("cccc") + " (récurrents)";
					},
				};
			}
		</script>
	</body>
</html>
