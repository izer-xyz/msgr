<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf8" />
		<title>Manage message</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>
		<script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
	</head>
	<body>
		<main class="font-[Noto_Sans]">
			<h1>Admin</h1>
			<div>
				<p>Messanges</p>
			</div>

			<div x-data="context" x-init="list" class="">
				<span x-text="now()"></span>
				<form @submit.prevent="save(msg)">
					<input name="id" type="text" x-model="msg.id" />
					<input name="date" type="text" x-model="msg.date" />
					<input name="time" type="text" x-model="msg.time" />
					<input name="refrence" type="text" x-model="msg.reference" />
					<input name="day" type="text" x-model="msg.day" />
					<div class="input">
						<select
							@change="msg = (day === '' ? { ...DEFAULT } : { ...DEFAULT } ) "
							x-model="day"
						>
							<option value="">Today</option>
							<option value="1">Monday</option>
							<option value="2">Tuesday</option>
							<option value="3">Wednesday</option>
							<option value="4">Thursday</option>
							<option value="5">Friday</option>
							<option value="6">Saturday</option>
							<option value="7">Sunday</option>
						</select>
					</div>
					<div class="input">
						<label for="message">Message</label>
						<input
							id="message"
							name="message"
							autofocus
							x-model="msg.message"
						/>
					</div>
					<div class="input">
						<label for="from">From</label>
						<input id="from" name="from" x-model="msg.from" />
					</div>
					<a href="" x-show="msg.id" @click.prevent="remove(msg)">delete</a>
					<button type="submit">Submit</button>
				</form>

				<div class="">
					<template x-for="item in msgs">
						<div
							x-show="item.day === day || day ==='' && item.day === now()[2]"
							@click.prevent="(msg === item ? msg = { ...DEFAULT } : msg = item)"
						>
							<div class="">
								<span class="" x-text="item.message"></span>
								<span class="" x-text="item.from"></span>
							</div>
						</div>
					</template>
				</div>
			</div>
		</main>
		<script>
			const DEFAULT = {
				date: "",
				message: "",
				time: "",
				from: "",
				id: "",
				reference: "",
				day: "",
			};

			function context() {
				return {
					DEFAULT,
					msgs: [],
					msg: {
						...DEFAULT,
					},
					day: "",

					now() {
						return luxon.DateTime.now()
							.setZone("Indian/Reunion")
							.toFormat("yyyy-LL-dd TT c")
							.split(" ");
					},

					async list() {
						await this.fetch("GET");
					},

					async save(msg) {
						if (msg.day === "") {
							msg.date = this.now()[0];
							msg.time = this.now()[1];
						}
						let response = await this.fetch("POST", msg);
						// todo check for errors.
						this.msg = { ...DEFAULT };
					},

					async remove(msg) {
						this.msg = { ...msg, id: "", referece: "" };
						await this.fetch("DELETE", msg);
					},

					async fetch(method, msg) {
						let response = await (
							await fetch(`/api/messages?${this.now()[0]}`, {
								method: method,
								body: msg ? JSON.stringify(msg) : null,
							})
						).json();
						this.msgs = response.messages;
						return response;
					},
				};
			}
		</script>
	</body>
</html>
