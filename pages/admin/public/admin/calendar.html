<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf8" />
		<title>Calandrier</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link href="https://unpkg.com/tailwindcss@1.0.6/dist/tailwind.min.css" rel="stylesheet"></link>
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>
		<script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
		<style>
			#preview {
				background: #a0a0a0; 
				height: 24em;
			}
		</style>
	</head>
	<body style="font-size: 24px; font-family: 'Noto Sans', sans-serif; width: 20em; margin: auto;">
		<main class="font-bold">
			<div>
				<p> <a href="messages">Messagerie</a> | Calandrier | <a href="">Aperçu</a> </p>
			</div>

			<div x-data="context" x-init="list">
				<form @submit.prevent="save(event)" class="flex flex-col py-4">
					
					<input name="id" type="hidden" x-model="event.id" />
					<input name="date" type="text" x-model="event.date" />
					<input name="refrence" type="hidden" x-model="event.reference" />
					<input name="day" type="text" x-model="event.day" />
					<input name="from" type="hidden"x-model="event.from" />
					
					<div class="w-full my-4">
						<select
							x-model="selected"
						>
							<option x-text="now()[0]"></option>
							<option value="1">Lu</option>
							<option value="2">Ma</option>
							<option value="3">Me</option>
							<option value="4">Je</option>
							<option value="5">Ve</option>
							<option value="6">Sa</option>
							<option value="7">Di</option>
						</select>
					</div>
					<div>
						<div></div>
					</div>
					<select name="time" x-model="event.time" class="font-bold border border-black p-2 mx-4">
						<option value="">--:--</option>
						<option>08:00</option>
						<option>08:30</option>
						<option>09:00</option>
						<option>09:30</option>
						<option>10:00</option>
						<option>10:30</option>
					</select>

					<input name="subject" type="text" x-model="event.subject" x-init="$watch('event.subject', () => $el.focus())" placeholder="Titre" class="font-bold border border-black p-2 mx-4"/>
					<textarea 
						id="content"
						name="content"
						autofocus
						x-model="event.content"
						class="font-bold border border-black p-2 mx-4"
						rows="3"
						placeholder="Tapez votre message ici et appuyez sur Entrée pour valider."
						@keydown.enter.prevent="$el.form.requestSubmit()"
					></textarea>
					<div class="justify-end flex font-normal">
						<a href="" x-show="event.id" @click.prevent="remove(event)" class="text-lg place-self-center">Supprimer</a> 
						<button type="submit" class="mx-4 px-2 rounded-lg bg-black text-white font-bold">Valider</button>
					</div>
				</form>

				<h1 class="py-4">Aperçu</h1>
				<div id="preview" class="flex-1 flex flex-col p-4">
					<template x-for="item in events">
						<div class="flex flex-col" x-show="item.day === selected || item.date === selected || selected === now()[0] && item.day === now()[2]"
							@click.prevent="(event === item ? event = { ...DEFAULT } : event = item)">
							<span class="" x-text="item.time"></span>
							<span :class="{'border-4': item.day, 'bg-white': item.id == event.id}" class="border-2 border-black px-2 py-1 rounded-lg" x-text="item.subject"></span>
							<span x-text="item.content"></span>
						</div>
					</template>
				</div>
			</div>
		</main>
		<script>
			const DEFAULT = {
				date: "",
				subject: "",
				content: "",
				time: "",
				from: "",
				id: "",
				reference: "",
				day: "",
				flag: "", 
			};

			function now() {
					return luxon.DateTime.now()
						.setZone("Indian/Reunion")
						.toFormat("yyyy-LL-dd TT c")
						.split(" ");
				}

			function context() {
				return {
					DEFAULT,
					events: [],
						event: {
						...DEFAULT
					},
					selected: now()[0],
					now() { return now() },

					async list() {
						await this.fetch("GET");
					},

					async save(event) {
						if (event.day === "" && event.date === "") {
							if (this.selected.length === 1) {
								event.day = this.selected; 
							} else {
								event.date = this.selected; 
							}
						}
						let response = await this.fetch("POST", event);
						// todo check for errors.
						this.event = { ...DEFAULT };
						//this.selected = ""; 
					},

					async remove(event) {
						this.event = { ...event, id: "", reference: "" };
						await this.fetch("DELETE", event);
					},

					async fetch(method, event) {
						let response = await (
							await fetch(`/api/admin/calendar?${this.now()[0]}`, {
								method: method,
								body: event ? JSON.stringify(event) : null,
							})
						).json();
						this.events = response.events;
						return response;
					},
				};
			}
		</script>
	</body>
</html>
