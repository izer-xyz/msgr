<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf8" />
		<title>Messagerie</title>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
			rel="stylesheet"
		/>
		<link href="https://unpkg.com/tailwindcss@1.0.6/dist/tailwind.min.css" rel="stylesheet"></link>
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
		></script>
		<script src="https://cdn.jsdelivr.net/npm/luxon@3.7.2/build/global/luxon.min.js"></script>
		<style>
			#preview {
				background: #a0a0a0; 
				height: 24em;
			}
		</style>
	</head>
	<body style="font-size: 24px; font-family: 'Noto Sans', sans-serif; width: 20em; margin: auto;">
		<main class="font-bold">
			<div>
				<a href="messages">Messagerie</a> |
				<a href="calendar">Calandrier</a> | <a href="device">Aperçu</a> | <a href="profile">P</a>
			</div>

			<div x-data="context" x-init="list">
				<form @submit.prevent="save(msg)" class="flex flex-col py-4">
					<input name="id" type="hidden" x-model="msg.id" />
					<input name="date" type="hidden" x-model="msg.date" />
					<input name="time" type="hidden" x-model="msg.time" />
					<input name="refrence" type="hidden" x-model="msg.reference" />
					<input name="day" type="hidden" x-model="msg.day" />
					<div class="w-full my-4">
						<select
							@change="msg = (selected === '' ? { ...DEFAULT } : { ...DEFAULT, day: selected} ) "
							x-model="selected"
						>
							<option value="" x-text="now()[0]"></option>
							<option value="1">Lu</option>
							<option value="2">Ma</option>
							<option value="3">Me</option>
							<option value="4">Je</option>
							<option value="5">Ve</option>
							<option value="6">Sa</option>
							<option value="7">Di</option>
						</select>
					</div>
					<textarea 
						id="content"
						name="content"
						autofocus
						x-model="msg.content"
						class="font-bold border border-black p-2 mx-4"
						rows="3"
						placeholder="Tapez votre message ici et appuyez sur Entrée pour envoyer."
						x-init="$watch('msg.content', () => $el.focus())"
						@keydown.enter.prevent="$el.form.requestSubmit()"
					></textarea>
					<input id="from" name="from" x-model="msg.from" placeholder="De" class="w-1/4 mx-4 my-2 p-2 self-end border border-black"/>
					<div class="justify-end flex font-normal">
						<a href="" x-show="msg.id" @click.prevent="remove(msg)" class="text-lg place-self-center">Supprimer</a> 
						<button type="submit" class="mx-4 px-2 rounded-lg bg-black text-white font-bold">Envoyer</button>
					</div>
				</form>

				<h1 class="py-4">Aperçu</h1>
				<div id="preview" class="flex-1 flex flex-col p-4">
					<template x-for="item in msgs">
						<div class="flex flex-col" x-show="item.day === selected || selected ==='' && item.day === now()[2]"
							@click.prevent="(msg === item ? msg = { ...DEFAULT } : msg = { ...item, from: profile.name })">
							<span :class="{'border-4': item.day, 'bg-white': item.id == msg.id}" class="border-2 border-black px-2 py-1 rounded-lg" x-text="item.content">
							</span>
							<span class="self-end" x-text="item.from"></span>
						</div>
					</template>
				</div>
			</div>
		</main>
		<script>
			const DEFAULT = {
				date: "",
				content: "",
				time: "",
				from: "",
				id: "",
				reference: "",
				day: "",
			};

			function context() {
				return {
					DEFAULT,
					msgs: [],
					msg: {
						...DEFAULT,
					},
					profile: {}, 
					selected: "",

					now() {
						return luxon.DateTime.now()
							.setZone("Indian/Reunion")
							.toFormat("yyyy-LL-dd TT c")
							.split(" ");
					},

					async list() {
						await this.fetch("GET");
					},

					async save(msg) {
						if (msg.day === "") {
							msg.date = this.now()[0];
							msg.time = this.now()[1];
						} else {
							msg.date = "";
							msg.time = "";
						}
						let response = await this.fetch("POST", msg);
						// todo check for errors.
						this.msg = { ...DEFAULT };
					},

					async remove(msg) {
						this.msg = { ...msg, id: "", reference: "" };
						await this.fetch("DELETE", msg);
					},

					async fetch(method, msg) {
						let response = await (
							await fetch(`/api/admin/messages?${this.now()[0]}`, {
								method: method,
								body: msg ? JSON.stringify(msg) : null,
							})
						).json();
						this.msgs = response.messages;
						this.profile = response.profile; 
						DEFAULT.from = this.profile.name; 
						return response;
					},
				};
			}
		</script>
	</body>
</html>
