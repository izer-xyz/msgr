<main class="max-w-96 flex flex-col m-auto text-xs border-4 border-white">
  <div class="flex justify-between text-lg pb-2">
    <span class="font-bold">Profil</span>
    <a
      href="http://w1n.cloudflareaccess.com/cdn-cgi/access/logout"
      class="font-[Material_Symbols_Outlined]"
    >
      logout
    </a>
  </div>
  <div x-data="profile" x-init="get">
    <form @submit.prevent="save(profile)" class="flex flex-col gap-2">
      <div class="flex flex-col">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="text"
          readonly
          x-model="profile.email"
          class="rounded-md p-1 ml-2 text-right"
        />
      </div>
      <div class="flex flex-col">
        <label for="name">Nom</label>
        <input
          id="name"
          type="text"
          x-model="profile.name"
          class="rounded-md border-1 p-1 ml-2 text-right"
        />
      </div>
      <div class="flex items-center justify-end gap-x-2 mt-4">
        <button
          type="submit"
          class="self-end text-white bg-black font-semibold rounded-lg px-2 py-1"
        >
          Enregsitrer
        </button>
      </div>
    </form>
  </div>
</main>
