<main class="max-w-96 flex flex-col m-auto text-md/6 border-4 border-white">
	<span class="text-lg font-bold pb-2">Messages</span>
	<div x-data="messages" x-init="list">
		<form
			@submit.prevent="msg.content && save(msg)"
			class="flex flex-col gap-4"
		>
			<div class="flex flex-col bg-gray-200 rounded-md p-2">
				<div class="font-bold">Selectioner le jour</div>
				<div class="ml-4">
					<label
						><input
							type="radio"
							:checked="selected_date"
							@click="select(selected_day.toString())"
						/>
						Aujourd'hui
					</label>
				</div>
				<div class="ml-4">
					<label
						><input
							type="radio"
							:checked="!selected_date"
							@click="select(selected_day.toString())"
						/>
						Récurrents
					</label>
					<div class="flex gap-x-1 justify-end items-center">
						<template x-for="(d,i) in ['Lu','Ma','Me','Je','Ve','Sa','Di']">
							<a
								href=""
								class="px-1 border-2 border-white bg-gray-200"
								:class="{
										'bg-white': selected_day === i + 1 && selected_date === '', 
										'border-gray-800': selected_day === i + 1 && selected_date === '', 
										'font-bold': selected_day === i + 1,
										'text-red-800': i > 4
									}"
								@click.prevent="select((i+1).toString())"
								><span x-text="d"></span
								><span
									class="align-middle ml-1 material-symbols-outlined"
									x-show="selected_day === i + 1 && selected_date === ''"
									>close</span
								></a
							>
						</template>
					</div>
				</div>
			</div>
			<div class="flex flex-col">
				<textarea
					id="content"
					name="content"
					autofocus
					x-model="msg.content"
					class="font-bold rounded-md border-1 p-2"
					rows="2"
					placeholder="Tapez votre message ici et appuyez sur Entrée pour envoyer."
					x-init="$watch('msg.content', () => $el.focus())"
					@keydown.enter.prevent="$el.form.requestSubmit()"
				></textarea>
			</div>
			<div
				class="flex items-center justify-end gap-x-2 font-semibold text-red-800"
			>
				<button
					type="submit"
					x-bind:disabled="loading || msg.content ===''"
					class="self-end text-white bg-black font-semibold rounded-lg px-2 py-1 disabled:opacity-50"
				>
					Envoyer
				</button>
			</div>
		</form>

		<div class="my-2 text-lg font-bold capitalize" x-text="dateOrDay"></div>
		<div id="preview" class="flex-1 flex flex-col p-2 h-[30em] bg-gray-200">
			<template x-for="item in msgs">
				<div
					class="flex justify-between items-center mb-1 pl-2 leading-3 hover:bg-white"
					:class="{'bg-white': msg === item}"
					x-show="item.day === selected_day.toString() || item.date && selected_date"
				>
					<div class="w-[19em] flex flex-col font-semibold">
						<div class="mb-[12px] flex flex-col">
							<span
								class="border-b-[2px] border-black px-[16px] py-[8px]"
								x-text="item.content"
							>
							</span>
							<div class="flex justify-between text-[.8em]">
								<span
									class="text-gray-700"
									x-text="item.time?.slice(0,5)"
								></span>
								<span x-text="item.from"></span>
							</div>
						</div>
					</div>
					<a
						href=""
						class="px-1 material-symbols-outlined"
						x-show="!item.day"
						@click.prevent="remove(item)"
						>delete</a
					>
					<a
						href=""
						class="px-1 material-symbols-outlined"
						x-show="item.day"
						@click.prevent="select(item.day)"
						>edit</a
					>
				</div>
			</template>
		</div>
		<div
			id="error"
			class="flex p-1 text-center bg-red-800 text-white"
			x-show="msgs && ($el.style.height = ($el.previousElementSibling.scrollHeight - $el.previousElementSibling.clientHeight) + 'px')"
		>
			Limit d'ecran
		</div>
	</div>
</main>
