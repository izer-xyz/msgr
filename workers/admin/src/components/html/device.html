<main class="max-w-96 flex flex-col m-auto text-xs border-4 border-white">
	<span class="text-lg font-bold pb-2">Tablette</span>
	<div x-data="device" x-init="list" class="flex flex-col gap-4">
		<div class="border-2 border-gray-200 p-2 pb-6">
			<div class="bg-black">
				<img
					x-init="$watch('selected', v => preview($el, v))"
					class="w-full h-auto opacity-85"
				/>
			</div>
		</div>
		<form @submit.prevent="save(selected, $el)" class="flex flex-col gap-2">
			<div class="flex flex-col">
				<label for="battery-voltage">Batterie (V)</label>
				<input
					id="battery-voltage"
					type="text"
					readonly
					x-model="selected['battery-voltage']"
					class="rounded-md p-1 ml-2 text-right"
				/>
			</div>
			<div class="flex flex-col">
				<label for="sleep_from"
					>En Veille <span x-text="selected.sleep ? '(actif)' : ''"></span
				></label>
				<div class="flex justify-end">
					<select
						id="sleep_from"
						x-model="selected.sleep_from"
						@change="selected.sleep_to = $el.value === '' ? $el.value : selected.sleep_to"
					>
						<option value="">--:--</option>
						<template x-for="h in 23">
							<template x-for="m in ['00', '30']">
								<option x-text="`${h<10?'0':''}${h}:${m}`"></option>
							</template>
						</template>
					</select>
					-
					<select
						id="sleep_to"
						x-model="selected.sleep_to"
						@change="selected.sleep_from = $el.value === '' ? $el.value : selected.sleep_from"
					>
						<option value="">--:--</option>
						<template x-for="h in 23">
							<template x-for="m in ['00', '30']">
								<option x-text="`${h<10?'0':''}${h}:${m}`"></option>
							</template>
						</template>
					</select>
				</div>
			</div>
			<div class="flex items-center justify-end gap-x-2 mt-4">
				<button
					type="submit"
					x-bind:disabled="loading"
					class="self-end text-white bg-black font-semibold rounded-lg px-2 py-1 disabled:opacity-50"
				>
					Enregsitrer
				</button>
			</div>
			<div class="my-2 text-lg font-bold capitalize">Technique</div>
			<div class="flex flex-col">
				<label for="id">Identifient</label>
				<select
					id="id"
					@change="selected = devices[$el.value]"
					class="rounded-md p-1 ml-2 text-right"
				>
					<template x-for="(item, index) in devices">
						<option x-text="item.id" :value="index"></option>
					</template>
				</select>
			</div>
			<div class="flex flex-col">
				<label for="sceen">Configuration</label>
				<input
					id="screen"
					type="text"
					readonly
					x-model="selected.screen"
					class="rounded-md p-1 ml-2 text-right"
				/>
			</div>
			<div class="flex flex-col">
				<label for="rssi">Wifi</label>
				<input
					id="rssi"
					type="text"
					readonly
					x-model="selected.rssi"
					class="rounded-md p-1 ml-2 text-right"
				/>
			</div>
		</form>
	</div>
</main>
