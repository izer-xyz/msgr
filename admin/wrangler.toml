"$schema" = "node_modules/wrangler/config-schema.json"
name = "trmnl-admin"
main = "worker.js"
compatibility_date = "2026-08-20"
upload_source_maps = true
send_metrics = false

[assets]
run_worker_first = [ "/api/*" ]

[observability]
enabled = true

[[analytics_engine_datasets]]
binding = "TRMNL_AUDIT"
dataset = "trmnl_audit"

[[services]]
binding = "TRMNL_IMG"
service = "trmnl-img"

[[durable_objects.bindings]]
name = "DEVICES"
class_name = "Devices"
script_name = "trmnl-api"

[[durable_objects.bindings]]
name = "BOARD"
class_name = "Board"

[exports.Board]
type = "durable-object"
storage = "sqlite"