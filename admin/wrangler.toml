"$schema" = "node_modules/wrangler/config-schema.json"
name = "trmnl-admin"
main = "worker.js"
compatibility_date = "2026-08-20"
upload_source_maps = true
send_metrics = false

[assets]
run_worker_first = [ "/api/*" ]

[observability]
enabled = true

[[kv_namespaces]]
binding = "TRMNL_DEVICES"
id = "93fbad6022314b8995a3c5d952a0d7cf"

[[kv_namespaces]]
binding = "TRMNL_BOARD"
id = "5fd6e1078bfd4781bc1b0e379618e45e"

[[analytics_engine_datasets]]
binding = "TRMNL_AUDIT"
dataset = "trmnl_audit"

[[services]]
binding = "TRMNL_IMG"
service = "trmnl-img"