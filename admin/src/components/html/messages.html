<main
	x-data="messages"
	x-init="list"
	class="md:max-w-full mx-auto max-w-96 flex flex-col md:flex-row text-md/6 border-4 border-white gap-x-8 justify-center"
	:class="{ 'animate-pulse': loading }"
>
	<div class="md:max-w-96 flex-1 mt-4">
		<span class="flex text-lg font-bold mb-4">Messages</span>
		<form
			@submit.prevent="msg.content && save(msg)"
			class="flex flex-col gap-4"
		>
			<div class="flex flex-col bg-light rounded-md px-2 py-1">
				<div class="font-bold">Sélectionner le jour</div>
				<div class="ml-4">
					<label
						><input
							type="radio"
							:checked="selected_date"
							@click="!selected_date && select(selected_day.toString())"
						/>
						Aujourd'hui
					</label>
				</div>
				<div class="ml-4">
					<label
						><input
							type="radio"
							:checked="!selected_date"
							@click="selected_date && select(selected_day.toString())"
						/>
						Récurrents
					</label>
					<div class="flex gap-x-1 justify-end items-center text-highlight">
						<template x-for="(d,i) in ['Lu','Ma','Me','Je','Ve','Sa','Di']">
							<a
								href=""
								class="px-1 border-2 border-white bg-light"
								:class="{
										'bg-white': selected_day === i + 1 && selected_date === '', 
										'border-dark': selected_day === i + 1 && selected_date === '', 
										'font-bold': selected_day === i + 1,
										'text-error': i > 4
									}"
								@click.prevent="select((i+1).toString())"
								><span x-text="d"></span
								><span
									class="align-middle ml-1 material-symbols-outlined"
									x-show="selected_day === i + 1 && selected_date === ''"
									>close</span
								></a
							>
						</template>
					</div>
				</div>
			</div>
			<div class="flex flex-col">
				<textarea
					id="content"
					name="content"
					autofocus
					x-model="msg.content"
					class="font-bold rounded-md border-1 p-2"
					rows="2"
					placeholder="Tapez votre message ici et appuyez sur Entrée pour envoyer."
					x-init="$watch('msg.content', () => $el.focus())"
					@keydown.enter.prevent="$el.form.requestSubmit()"
				></textarea>
			</div>
			<div class="flex items-center justify-end gap-x-2 font-semibold">
				<button
					type="submit"
					x-bind:disabled="loading || msg.content ===''"
					class="self-end text-white bg-highlight font-semibold rounded-lg px-2 py-1 disabled:opacity-50"
				>
					Envoyer
				</button>
			</div>
		</form>
	</div>
	<div class="md:max-w-74 flex-1 md:order-first mt-4 flex flex-col">
		<div id="preview" class="flex flex-col px-2 h-[30em] bg-light rounded-md">
			<div
				class="text-lg font-bold capitalize mb-4 mt-1"
				x-text="dateOrDay"
			></div>
			<template x-for="item in msgs">
				<div
					class="flex justify-between mb-1 pl-2 leading-[1.2] rounded-md hover:bg-white"
					:class="{'bg-white': msg.id === item.id}"
					x-show="item.day === selected_day.toString() || item.date && selected_date"
				>
					<div class="w-[19em] flex flex-col">
						<div class="mb-[12px] flex flex-col">
							<span
								class="border-b-[1px] border-dark px-[12px] py-[8px]"
								x-text="item.content"
							>
							</span>
							<div class="flex justify-between text-[.8em]">
								<span class="text-dark" x-text="item.time?.slice(0,5)"></span>
								<span x-text="item.from"></span>
							</div>
						</div>
					</div>
					<a
						href=""
						class="material-symbols-outlined p-[8px] text-highlight"
						x-show="!item.day"
						@click.prevent="remove(item)"
						>delete</a
					>
					<a
						href=""
						class="material-symbols-outlined p-[8px] text-highlight"
						x-show="item.day"
						@click.prevent="select(item.day)"
						>edit</a
					>
				</div>
			</template>
		</div>
		<div
			id="error"
			class="flex p-1 text-center bg-error text-white"
			x-show="msgs && ($el.style.height = ($el.previousElementSibling.scrollHeight - $el.previousElementSibling.clientHeight) + 'px')"
		>
			Limit d'ecran
		</div>
	</div>
</main>
