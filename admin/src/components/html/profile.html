<main
  x-data="profile"
  x-init="get"
  class="md:max-w-full mx-auto max-w-96 flex flex-col md:flex-row text-md/6 border-4 border-white gap-x-8 justify-center"
  :class="{ 'animate-pulse': loading }"
>
  <div class="md:max-w-96 flex-1 mt-4">
    <div class="flex justify-between text-lg mb-4">
      <span class="font-bold">Profil</span>
      <a
        href="http://w1n.cloudflareaccess.com/cdn-cgi/access/logout"
        class="font-[Material_Symbols_Outlined] text-highlight"
      >
        logout
      </a>
    </div>

    <form @submit.prevent="save(profile)" class="flex flex-col gap-2">
      <div class="flex flex-col">
        <label for="email">E-mail</label>
        <input
          id="email"
          type="text"
          readonly
          x-model="profile.email"
          class="rounded-md p-1 ml-2 text-right"
        />
      </div>
      <div class="flex flex-col">
        <label for="name">Nom</label>
        <input
          id="name"
          type="text"
          x-model="profile.name"
          class="rounded-md border-1 p-1 ml-2 text-right"
        />
      </div>
      <div class="flex items-center justify-end gap-x-2 mt-4">
        <button
          type="submit"
          x-bind:disabled="loading"
          class="self-end text-white bg-highlight font-semibold rounded-lg px-2 py-1 disabled:bg-medium"
        >
          Enregistrer
        </button>
      </div>
    </form>
  </div>
</main>
