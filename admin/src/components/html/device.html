<main
	x-data="device"
	x-init="list"
	class="flex flex-col text-md/6 border-4 border-white gap-x-8 justify-center"
>
	<div class="max-w-96 md:w-96 md:mx-auto mt-4 flex justify-between">
		<span class="flex text-lg font-bold mb-4">Tablette</span>
		<span
			class="material-symbols-outlined"
			x-text="`battery_android_${battery()}`"
		></span>
	</div>
	<div class="md:w-[80%] md:mx-auto flex-1">
		<div class="border-2 border-light p-2 pb-6">
			<div class="bg-[#566035]">
				<img
					x-show="!loading"
					:src="selected.id && `/api/admin/device/preview?id=${selected.id}`"
					class="w-full h-auto opacity-80"
				/>
			</div>
		</div>
	</div>
	<form
		@submit.prevent="save(selected, $el)"
		class="max-w-96 md:w-96 md:mx-auto flex-1 mt-4 flex flex-col gap-2"
	>
		<div class="flex flex-col">
			<label for="battery-voltage">Batterie (V)</label>
			<input
				id="battery-voltage"
				type="text"
				readonly
				x-model="selected['battery-voltage']"
				class="rounded-md p-1 ml-2 text-right"
			/>
		</div>
		<div class="flex flex-col">
			<label for="sleep_from"
				>En Veille <span x-text="selected.sleep ? '(actif)' : ''"></span
			></label>
			<div class="flex justify-end">
				<select
					id="sleep_from"
					x-model="selected.sleep_from"
					@change="selected.sleep_to = $el.value === '' ? $el.value : selected.sleep_to"
				>
					<option value="">--:--</option>
					<template x-for="h in 23">
						<template x-for="m in ['00', '30']">
							<option x-text="`${h<10?'0':''}${h}:${m}`"></option>
						</template>
					</template>
				</select>
				-
				<select
					id="sleep_to"
					x-model="selected.sleep_to"
					@change="selected.sleep_from = $el.value === '' ? $el.value : selected.sleep_from"
				>
					<option value="">--:--</option>
					<template x-for="h in 23">
						<template x-for="m in ['00', '30']">
							<option x-text="`${h<10?'0':''}${h}:${m}`"></option>
						</template>
					</template>
				</select>
			</div>
		</div>
		<div class="flex items-center justify-end gap-x-2 mt-4">
			<button
				type="submit"
				x-bind:disabled="loading"
				class="self-end text-white bg-highlight font-semibold rounded-lg px-2 py-1 disabled:opacity-50"
			>
				Enregistrer
			</button>
		</div>
		<div class="my-2 text-lg font-bold capitalize">Technique</div>
		<div class="flex flex-col">
			<label for="id">Identifient</label>
			<select
				id="id"
				@change="selected = devices[$el.value]"
				class="rounded-md p-1 ml-2 text-right"
			>
				<template x-for="(item, index) in devices">
					<option x-text="item.id" :value="index"></option>
				</template>
			</select>
		</div>
		<div class="flex flex-col">
			<label for="sceen">Configuration</label>
			<input
				id="screen"
				type="text"
				readonly
				x-model="selected.screen"
				class="rounded-md p-1 ml-2 text-right"
				@dblclick="$el.readOnly = !$el.readOnly"
			/>
		</div>
		<div class="flex flex-col">
			<label for="time_zone">Fuseau Horaire</label>
			<input
				id="time_zone"
				type="text"
				readonly
				x-model="selected.time_zone"
				class="rounded-md p-1 ml-2 text-right"
				@dblclick="$el.readOnly = !$el.readOnly"
			/>
		</div>
		<div class="flex flex-col">
			<label for="refresh_rate">Fréquence (sec)</label>
			<input
				id="refresh_rate"
				type="text"
				readonly
				x-model="selected.refresh_rate"
				class="rounded-md p-1 ml-2 text-right"
				@dblclick="$el.readOnly = !$el.readOnly"
			/>
		</div>
		<div class="flex flex-col">
			<label for="rssi">Wifi</label>
			<input
				id="rssi"
				type="text"
				readonly
				x-model="selected.rssi"
				class="rounded-md p-1 ml-2 text-right"
			/>
		</div>
	</form>
</main>
